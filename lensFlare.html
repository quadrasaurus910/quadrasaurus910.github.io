<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Wedding Canvas</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505; /* Deep dark background */
            overflow: hidden;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }

        /* UI Controls for screen recording setup */
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            z-index: 10;
            backdrop-filter: blur(4px);
            transition: opacity 0.3s;
        }

        /* Hide controls when hovering away so they aren't in the recording */
        #controls:not(:hover) {
            opacity: 0.2;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div class="control-group">
            <label for="speedSlider">Rotation Speed:</label>
            <input type="range" id="speedSlider" min="0.005" max="0.1" step="0.005" value="0.02">
        </div>
        <small style="display:block; margin-top:5px; color:#aaa;">(Hover away to fade controls)</small>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const speedSlider = document.getElementById('speedSlider');

        const img = new Image();
        img.src = 'photoSet1b.png';

        let palette = [];
        let orbs = [];
        let rotationAngle = 0;
        let centerX, centerY;

        // Configuration
        const ORB_COUNT = 20;

        img.onload = () => {
            resizeCanvas();
            extractPalette();
            generateOrbs();
            requestAnimationFrame(animate);
        };

        window.addEventListener('resize', resizeCanvas);

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            centerX = canvas.width / 2;
            centerY = canvas.height / 2;
        }

        // Extracts colors from the loaded image to create a dynamic palette
        function extractPalette() {
            const offScreenCanvas = document.createElement('canvas');
            const offCtx = offScreenCanvas.getContext('2d');
            offScreenCanvas.width = 100; 
            offScreenCanvas.height = 100;
            offCtx.drawImage(img, 0, 0, 100, 100);
            
            const imageData = offCtx.getImageData(0, 0, 100, 100).data;
            
            // Sample pixels, looking specifically for brighter colors (like stained glass)
            for (let i = 0; i < imageData.length; i += 16) { 
                let r = imageData[i];
                let g = imageData[i+1];
                let b = imageData[i+2];
                let brightness = (r + g + b) / 3;
                
                if (brightness > 130) { // Keep brighter colors for the lens flares
                    palette.push({r, g, b});
                }
            }

            // Fallback golden palette if image is too dark
            if (palette.length === 0) {
                palette = [
                    {r: 255, g: 215, b: 100},
                    {r: 255, g: 170, b: 50},
                    {r: 255, g: 230, b: 150}
                ];
            }
        }

        // Creates the orb objects with parallax and fading properties
        function generateOrbs() {
            orbs = [];
            for (let i = 0; i < ORB_COUNT; i++) {
                let colorIndex = Math.floor(Math.random() * palette.length);
                let color = palette[colorIndex];
                
                orbs.push({
                    color: color,
                    radius: Math.random() * 60 + 20, // Varying sizes
                    distance: Math.random() * (canvas.height * 0.6), // Varying distances from center
                    baseAngle: Math.random() * Math.PI * 2, // Starting pivot position
                    parallaxSpeed: 1 + (Math.random() * 0.4 - 0.2), // Pivot slightly faster/slower than main image
                    fadeTriggerOffset: Math.random() * Math.PI * 2, // The specific angle where it catches the light
                    fadeFrequency: Math.floor(Math.random() * 2) + 1 // How often it flares per full rotation
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update global rotation based on the adjustable slider
            let speed = parseFloat(speedSlider.value) * (Math.PI / 180);
            rotationAngle += speed;

            // 1. Draw Rotating Image
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(rotationAngle);
            
            // Constrain image height to window height
            let scale = canvas.height / img.height;
            let drawWidth = img.width * scale;
            let drawHeight = canvas.height;
            
            ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
            ctx.restore();

            // 2. Draw Dynamic Lens Flares (Orbs)
            ctx.globalCompositeOperation = 'screen'; // Creates the glowing light blend effect

            orbs.forEach(orb => {
                // Parallax pivot angle
                let orbCurrentAngle = orb.baseAngle + (rotationAngle * orb.parallaxSpeed);
                let x = centerX + Math.cos(orbCurrentAngle) * orb.distance;
                let y = centerY + Math.sin(orbCurrentAngle) * orb.distance;

                // Calculate fade in/out based on perspective rotation
                // Using sine wave to gradually fade based on the image's rotation angle
                let lightCatch = Math.sin((rotationAngle * orb.fadeFrequency) + orb.fadeTriggerOffset);
                let alpha = Math.max(0, lightCatch) * 0.85; // Tops out at 85% opacity

                if (alpha > 0.05) {
                    ctx.beginPath();
                    
                    // Offset gradient center to create the dimensional crescent thickness
                    let offsetX = x - orb.radius * 0.35;
                    let offsetY = y - orb.radius * 0.35;
                    
                    let grad = ctx.createRadialGradient(offsetX, offsetY, orb.radius * 0.1, x, y, orb.radius);
                    
                    // Transparent center -> Faint Body -> Dense Crescent Edge -> Fade Out
                    grad.addColorStop(0, `rgba(${orb.color.r}, ${orb.color.g}, ${orb.color.b}, 0)`);
                    grad.addColorStop(0.6, `rgba(${orb.color.r}, ${orb.color.g}, ${orb.color.b}, ${alpha * 0.3})`);
                    grad.addColorStop(0.9, `rgba(${orb.color.r}, ${orb.color.g}, ${orb.color.b}, ${alpha})`);
                    grad.addColorStop(1, `rgba(${orb.color.r}, ${orb.color.g}, ${orb.color.b}, 0)`);

                    ctx.fillStyle = grad;
                    ctx.arc(x, y, orb.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Reset blend mode for next frame
            ctx.globalCompositeOperation = 'source-over';
            
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
