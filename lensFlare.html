<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anniversary Animation</title>
    <style>
        /* Reset and base styles for full-screen recording */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container to hide edges during rotation and zoom */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Image Styles */
        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            /* Start slightly scaled to prevent edges from showing during rotation */
            transform: scale(1.05) rotate(0deg);
            opacity: 0;
            
            /* Fade in immediately, then trigger motion after 3 seconds */
            animation: 
                fadeIn 2s forwards,
                imageMotion 30s ease-in-out 3s forwards; 
        }

        /* Lens Flare / Golden Orb Styles */
        .flare-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicking through if needed */
            opacity: 0;
            
            /* Wait 3 seconds before fading in the flares */
            animation: fadeInFlares 3s ease-in 3s forwards;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            /* Golden gradient fading to transparent */
            background: radial-gradient(circle, rgba(255, 215, 100, 0.6) 0%, rgba(255, 170, 50, 0.2) 40%, rgba(0, 0, 0, 0) 70%);
            mix-blend-mode: screen; /* Creates the glowing light effect */
            filter: blur(8px);
        }

        /* Positioning and individual animations for parallax */
        .orb1 { width: 40vmin; height: 40vmin; top: 10%; left: 20%; animation: float1 25s infinite alternate ease-in-out; }
        .orb2 { width: 60vmin; height: 60vmin; top: 50%; left: 60%; animation: float2 35s infinite alternate ease-in-out; }
        .orb3 { width: 30vmin; height: 30vmin; top: 70%; left: 15%; animation: float3 20s infinite alternate ease-in-out; }
        .orb4 { width: 70vmin; height: 70vmin; top: -10%; left: 50%; animation: float4 40s infinite alternate ease-in-out; }
        .orb5 { width: 45vmin; height: 45vmin; top: 30%; left: 80%; animation: float5 28s infinite alternate ease-in-out; }

        /* Keyframes for Image Motion */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes fadeInFlares {
            to { opacity: 0.85; }
        }

        @keyframes imageMotion {
            0% {
                transform: scale(1.05) rotate(0deg);
            }
            100% {
                /* Zooms in and adds a gentle tilt */
                transform: scale(1.25) rotate(3deg);
            }
        }

        /* Keyframes for Parallax Flare Floating */
        @keyframes float1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(5vw, -8vh) scale(1.2); } }
        @keyframes float2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-8vw, 6vh) scale(0.9); } }
        @keyframes float3 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(6vw, 10vh) scale(1.3); } }
        @keyframes float4 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-5vw, -5vh) scale(1.1); } }
        @keyframes float5 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(8vw, -3vh) scale(0.85); } }
    </style>
</head>
<body>
    <div class="scene">
        <img src="photoSet1b.png" alt="A beautiful wedding memory" class="main-image">
        <div class="flare-container">
            <div class="orb orb1"></div>
            <div class="orb orb2"></div>
            <div class="orb orb3"></div>
            <div class="orb orb4"></div>
            <div class="orb orb5"></div>
        </div>
    </div>
</body>
</html>
